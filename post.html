<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Loading... — Rohan Pradyumna</title>

<!-- SEO Meta Tags (updated dynamically via JS) -->
<meta name="description" id="meta-description" content="A blog post by Rohan Pradyumna about startups, AI, and the builder's journey." />
<meta name="author" content="Rohan Pradyumna" />

<!-- Open Graph / Facebook (updated dynamically via JS) -->
<meta property="og:type" content="article" />
<meta property="og:url" id="og-url" content="https://rohanpradyumna.vercel.app/posts/" />
<meta property="og:title" id="og-title" content="Blog Post — Rohan Pradyumna" />
<meta property="og:description" id="og-description" content="A blog post by Rohan Pradyumna about startups, AI, and the builder's journey." />
<meta property="og:image" content="https://rohanpradyumna.vercel.app/assets/rohan-casual.png" />
<meta property="og:site_name" content="Rohan Pradyumna" />
<meta property="article:author" content="Rohan Pradyumna" />

<!-- Twitter Card (updated dynamically via JS) -->
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:url" id="twitter-url" content="https://rohanpradyumna.vercel.app/posts/" />
<meta name="twitter:title" id="twitter-title" content="Blog Post — Rohan Pradyumna" />
<meta name="twitter:description" id="twitter-description" content="A blog post by Rohan Pradyumna about startups, AI, and the builder's journey." />
<meta name="twitter:image" content="https://rohanpradyumna.vercel.app/assets/rohan-casual.png" />

<!-- Favicon -->
<link rel="icon" type="image/png" href="/assets/rohan-casual.png" />
<link rel="apple-touch-icon" href="/assets/rohan-casual.png" />

<!-- JSON-LD will be injected dynamically -->
<script id="schema-blogposting" type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "headline": "Blog Post",
  "author": {
    "@type": "Person",
    "name": "Rohan Pradyumna",
    "url": "https://rohanpradyumna.vercel.app"
  },
  "publisher": {
    "@type": "Person",
    "name": "Rohan Pradyumna"
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "https://rohanpradyumna.vercel.app/posts/"
  }
}
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #faf7ef;
    --paper-2: #f3ecd8;
    --ink: #1a1a1a;
    --ink-2: #4a4a4a;
    --grid: rgba(160, 140, 80, 0.14);
    --grid-strong: rgba(160, 140, 80, 0.22);
    --card: #1a1a1a;
    --card-ink: #f5f2e8;
    --accent: #e85d3a;
    --accent-blue: #2d6cdf;
    --accent-green: #3a7d44;
    --accent-yellow: #f2c230;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    min-height: 100%;
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    background: var(--paper);
  }

  /* Warm paper with graph grid */
  .board {
    position: fixed;
    inset: 0;
    background-color: #faf7ef;
    background-image:
      linear-gradient(to right, var(--grid) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px),
      linear-gradient(to right, var(--grid-strong) 1px, transparent 1px),
      linear-gradient(to bottom, var(--grid-strong) 1px, transparent 1px),
      radial-gradient(ellipse at 50% 40%, #fffbef 0%, #faf5e4 55%, #f2e9cf 100%);
    background-size:
      28px 28px,
      28px 28px,
      140px 140px,
      140px 140px,
      100% 100%;
    z-index: -1;
  }
  .board::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.6  0 0 0 0 0.5  0 0 0 0 0.3  0 0 0 0.25 0'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='0.4'/></svg>");
    opacity: 0.35;
    pointer-events: none;
    mix-blend-mode: multiply;
  }
  .board::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(120, 90, 40, 0.08) 100%);
    pointer-events: none;
  }

  /* Header */
  .brand {
    position: fixed;
    top: 24px;
    left: 28px;
    z-index: 1000;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .brand a {
    text-decoration: none;
    color: inherit;
  }
  .brand .name {
    font-family: 'Instrument Serif', serif;
    font-size: 34px;
    font-weight: 400;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .brand .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); align-self: center; }
  .brand .sub {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    color: var(--ink-2);
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  .corner {
    position: fixed;
    top: 24px;
    right: 28px;
    z-index: 1000;
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    color: var(--ink-2);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .corner a {
    color: var(--ink-2);
    text-decoration: none;
    transition: color 0.2s;
  }
  .corner a:hover {
    color: var(--accent);
  }

  /* Main content */
  .content {
    position: relative;
    max-width: 680px;
    margin: 0 auto;
    padding: 120px 24px 80px;
  }

  /* Back link */
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Geist Mono', monospace;
    font-size: 12px;
    color: var(--ink-2);
    text-decoration: none;
    margin-bottom: 32px;
    transition: color 0.2s;
  }
  .back-link:hover {
    color: var(--accent);
  }
  .back-link::before {
    content: '<-';
  }

  /* Post header */
  .post-header {
    margin-bottom: 40px;
  }

  .post-tags {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .post-tag {
    padding: 4px 10px;
    border-radius: 4px;
    font-family: 'Geist Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }

  .post-tag.ai { background: rgba(232, 93, 58, 0.15); color: var(--accent); }
  .post-tag.startups { background: rgba(45, 108, 223, 0.15); color: var(--accent-blue); }
  .post-tag.philosophy { background: rgba(58, 125, 68, 0.15); color: var(--accent-green); }
  .post-tag.life { background: rgba(242, 194, 48, 0.25); color: #9a7a0a; }

  .post-title {
    font-family: 'Instrument Serif', serif;
    font-size: 42px;
    font-weight: 400;
    color: var(--ink);
    line-height: 1.2;
    margin-bottom: 12px;
  }

  .post-meta {
    font-family: 'Geist Mono', monospace;
    font-size: 12px;
    color: var(--ink-2);
    letter-spacing: 0.02em;
  }

  /* Post content - Markdown styles */
  .post-content {
    font-family: 'Geist', sans-serif;
    font-size: 17px;
    line-height: 1.7;
    color: var(--ink);
  }

  .post-content p {
    margin-bottom: 1.5em;
  }

  .post-content h2 {
    font-family: 'Instrument Serif', serif;
    font-size: 28px;
    font-weight: 400;
    color: var(--ink);
    margin-top: 2em;
    margin-bottom: 0.75em;
  }

  .post-content h3 {
    font-family: 'Instrument Serif', serif;
    font-size: 22px;
    font-weight: 400;
    color: var(--ink);
    margin-top: 1.5em;
    margin-bottom: 0.5em;
  }

  .post-content strong {
    font-weight: 600;
    color: var(--ink);
  }

  .post-content em {
    font-style: italic;
  }

  .post-content a {
    color: var(--accent);
    text-decoration: underline;
    text-underline-offset: 2px;
    transition: color 0.2s;
  }
  .post-content a:hover {
    color: var(--accent-blue);
  }

  .post-content ul, .post-content ol {
    margin-bottom: 1.5em;
    padding-left: 1.5em;
  }

  .post-content li {
    margin-bottom: 0.5em;
  }

  .post-content li::marker {
    color: var(--accent);
  }

  .post-content blockquote {
    border-left: 4px solid var(--accent);
    padding-left: 20px;
    margin: 1.5em 0;
    font-style: italic;
    color: var(--ink-2);
  }

  .post-content blockquote p {
    margin-bottom: 0;
  }

  .post-content code {
    font-family: 'Geist Mono', monospace;
    font-size: 0.9em;
    background: rgba(0, 0, 0, 0.06);
    padding: 2px 6px;
    border-radius: 4px;
  }

  .post-content pre {
    background: #1a1a1a;
    color: #f5f2e8;
    padding: 20px 24px;
    border-radius: 12px;
    margin: 1.5em 0;
    overflow-x: auto;
    font-family: 'Geist Mono', monospace;
    font-size: 14px;
    line-height: 1.5;
  }

  .post-content pre code {
    background: none;
    padding: 0;
    font-size: inherit;
  }

  .post-content hr {
    border: none;
    height: 1px;
    background: var(--grid-strong);
    margin: 2.5em 0;
  }

  .post-content img {
    max-width: 100%;
    border-radius: 8px;
    margin: 1.5em 0;
  }

  /* Loading state */
  .loading {
    text-align: center;
    padding: 100px 20px;
  }
  .loading-spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--grid-strong);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Error state */
  .error-state {
    text-align: center;
    padding: 100px 20px;
    color: var(--ink-2);
  }
  .error-state-icon {
    font-size: 48px;
    margin-bottom: 16px;
    opacity: 0.5;
  }
  .error-state-text {
    font-family: 'Geist Mono', monospace;
    font-size: 14px;
    margin-bottom: 24px;
  }
  .error-state a {
    display: inline-block;
    padding: 10px 20px;
    background: var(--ink);
    color: var(--paper);
    font-family: 'Geist Mono', monospace;
    font-size: 12px;
    text-decoration: none;
    border-radius: 8px;
    transition: background 0.2s;
  }
  .error-state a:hover {
    background: var(--accent);
  }

  /* Mobile */
  @media (max-width: 768px) {
    .brand {
      top: 16px;
      left: 16px;
      gap: 6px;
    }
    .brand .name {
      font-size: 26px;
    }
    .brand .dot {
      width: 5px;
      height: 5px;
    }
    .brand .sub {
      display: none;
    }
    .corner {
      top: 16px;
      right: 16px;
      font-size: 10px;
    }
    .content {
      padding: 90px 16px 60px;
    }
    .post-title {
      font-size: 32px;
    }
    .post-content {
      font-size: 16px;
    }
    .post-content h2 {
      font-size: 24px;
    }
    .post-content h3 {
      font-size: 20px;
    }
    .post-content pre {
      padding: 16px;
      font-size: 13px;
      border-radius: 8px;
    }
  }

  @media (max-width: 380px) {
    .brand .name {
      font-size: 22px;
    }
    .post-title {
      font-size: 28px;
    }
  }
</style>
</head>
<body>
  <div class="board"></div>

  <div class="brand">
    <a href="/">
      <span class="name">rohan</span>
    </a>
    <span class="dot"></span>
    <span class="sub">writing</span>
  </div>

  <div class="corner">
    <a href="/blog.html">all posts</a>
  </div>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script type="text/babel">
const { useState, useEffect } = React;

// Simple frontmatter parser
function parseFrontmatter(content) {
  const match = content.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
  if (!match) {
    return { meta: {}, content };
  }

  const frontmatter = match[1];
  const body = match[2];

  const meta = {};
  frontmatter.split('\n').forEach(line => {
    const colonIndex = line.indexOf(':');
    if (colonIndex === -1) return;

    const key = line.slice(0, colonIndex).trim();
    let value = line.slice(colonIndex + 1).trim();

    // Remove quotes
    if ((value.startsWith('"') && value.endsWith('"')) ||
        (value.startsWith("'") && value.endsWith("'"))) {
      value = value.slice(1, -1);
    }

    // Parse arrays
    if (value.startsWith('[') && value.endsWith(']')) {
      value = value.slice(1, -1).split(',').map(s => {
        s = s.trim();
        if ((s.startsWith('"') && s.endsWith('"')) ||
            (s.startsWith("'") && s.endsWith("'"))) {
          s = s.slice(1, -1);
        }
        return s;
      });
    }

    meta[key] = value;
  });

  return { meta, content: body };
}

function formatDate(dateStr) {
  const date = new Date(dateStr);
  return date.toLocaleDateString('en-US', {
    year: 'numeric',
    month: 'long',
    day: 'numeric'
  });
}

// Get slug from URL
function getSlugFromUrl() {
  const path = window.location.pathname;
  // Handle both /blog/slug and /blog/slug/ formats
  const match = path.match(/\/blog\/([^\/]+)/);
  return match ? match[1] : null;
}

const TAG_COLORS = {
  ai: 'ai',
  startups: 'startups',
  philosophy: 'philosophy',
  life: 'life',
};

function Post() {
  const [post, setPost] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => {
    const slug = getSlugFromUrl();

    if (!slug) {
      setError('No post specified');
      setLoading(false);
      return;
    }

    // Fetch the markdown file
    fetch(`/posts/${slug}.md`)
      .then(res => {
        if (!res.ok) throw new Error('Post not found');
        return res.text();
      })
      .then(content => {
        const { meta, content: body } = parseFrontmatter(content);

        // Configure marked
        marked.setOptions({
          gfm: true,
          breaks: true,
        });

        const htmlContent = marked.parse(body);

        setPost({
          ...meta,
          htmlContent,
        });

        // Update page title
        document.title = `${meta.title || 'Post'} — Rohan Pradyumna`;

        // Update meta tags dynamically for SEO
        const postUrl = `https://rohanpradyumna.vercel.app/posts/${slug}`;
        const postDescription = meta.excerpt || `A blog post by Rohan Pradyumna`;

        document.getElementById('meta-description')?.setAttribute('content', postDescription);
        document.getElementById('og-url')?.setAttribute('content', postUrl);
        document.getElementById('og-title')?.setAttribute('content', `${meta.title} — Rohan Pradyumna`);
        document.getElementById('og-description')?.setAttribute('content', postDescription);
        document.getElementById('twitter-url')?.setAttribute('content', postUrl);
        document.getElementById('twitter-title')?.setAttribute('content', `${meta.title} — Rohan Pradyumna`);
        document.getElementById('twitter-description')?.setAttribute('content', postDescription);

        // Update JSON-LD schema
        const schemaEl = document.getElementById('schema-blogposting');
        if (schemaEl) {
          const schema = {
            "@context": "https://schema.org",
            "@type": "BlogPosting",
            "headline": meta.title,
            "description": postDescription,
            "datePublished": meta.date,
            "author": {
              "@type": "Person",
              "name": "Rohan Pradyumna",
              "url": "https://rohanpradyumna.vercel.app"
            },
            "publisher": {
              "@type": "Person",
              "name": "Rohan Pradyumna"
            },
            "mainEntityOfPage": {
              "@type": "WebPage",
              "@id": postUrl
            },
            "keywords": meta.tags ? meta.tags.join(', ') : ''
          };
          schemaEl.textContent = JSON.stringify(schema);
        }

        setLoading(false);
      })
      .catch(err => {
        console.error('Error loading post:', err);
        setError(err.message);
        setLoading(false);
      });
  }, []);

  if (loading) {
    return (
      <div className="content">
        <div className="loading">
          <div className="loading-spinner"></div>
          <div style={{ fontFamily: "'Geist Mono', monospace", fontSize: 12, color: 'var(--ink-2)' }}>
            loading post...
          </div>
        </div>
      </div>
    );
  }

  if (error) {
    return (
      <div className="content">
        <div className="error-state">
          <div className="error-state-icon">404</div>
          <div className="error-state-text">post not found</div>
          <a href="/blog.html">back to all posts</a>
        </div>
      </div>
    );
  }

  const tags = Array.isArray(post.tags) ? post.tags : [];

  return (
    <div className="content">
      <a href="/blog.html" className="back-link">back to all posts</a>

      <div className="post-header">
        {tags.length > 0 && (
          <div className="post-tags">
            {tags.map(tag => (
              <span key={tag} className={`post-tag ${TAG_COLORS[tag] || ''}`}>
                {tag}
              </span>
            ))}
          </div>
        )}
        <h1 className="post-title">{post.title}</h1>
        <div className="post-meta">{formatDate(post.date)}</div>
      </div>

      <div
        className="post-content"
        dangerouslySetInnerHTML={{ __html: post.htmlContent }}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Post />);
  </script>
</body>
</html>
