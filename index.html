// ============================================================================
// Sticker system: draggable, peel-on-hover, click handlers
// ============================================================================

const { useState, useEffect, useRef, useCallback } = React;

// Tap sound using Web Audio API
let tapAudioCtx = null;
function playTapSound() {
  if (!tapAudioCtx) tapAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const ctx = tapAudioCtx;
  if (ctx.state === 'suspended') ctx.resume();

  const now = ctx.currentTime;

  // Create a short click sound using noise burst
  const bufferSize = ctx.sampleRate * 0.015; // 15ms
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);

  for (let i = 0; i < bufferSize; i++) {
    // Sharp attack, quick decay
    const envelope = Math.exp(-i / (bufferSize * 0.15));
    data[i] = (Math.random() * 2 - 1) * envelope;
  }

  const noise = ctx.createBufferSource();
  noise.buffer = buffer;

  // Bandpass filter to shape the click
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 2500;
  filter.Q.value = 1.2;

  const gain = ctx.createGain();
  gain.gain.value = 0.4;

  noise.connect(filter).connect(gain).connect(ctx.destination);
  noise.start(now);
}

// Base Sticker component — handles drag, peel, rotation, shadow, entrance animation
function Sticker({
  id,
  initial,
  zBase = 1,
  children,
  onClick,
  onDragStart,
  onDragEnd,
  title,
  peelColor = '#ffffff',
  className = '',
  style = {},
  entranceDelay = 0,
}) {
  const [pos, setPos] = useState({ x: initial.x, y: initial.y, rot: initial.rot || 0 });
  const [dragging, setDragging] = useState(false);
  const [hovered, setHovered] = useState(false);
  const [z, setZ] = useState(zBase);
  const [hasDragged, setHasDragged] = useState(false);
  const [hasEntered, setHasEntered] = useState(false);
  const dragRef = useRef({ active: false, moved: false, startX: 0, startY: 0, origX: 0, origY: 0, pointerId: null });
  const elRef = useRef(null);

  // Entrance animation trigger
  useEffect(() => {
    const timer = setTimeout(() => setHasEntered(true), entranceDelay);
    return () => clearTimeout(timer);
  }, [entranceDelay]);

  // Update position when initial changes (window resize) - but only if user hasn't dragged
  useEffect(() => {
    if (!hasDragged) {
      setPos({ x: initial.x, y: initial.y, rot: initial.rot || 0 });
    }
  }, [initial.x, initial.y, initial.rot, hasDragged]);

  const onPointerDown = (e) => {
    if (e.button && e.button !== 0) return;
    playTapSound(); // Play tap sound on touch
    elRef.current.setPointerCapture(e.pointerId);
    dragRef.current = {
      active: true,
      moved: false,
      startX: e.clientX,
      startY: e.clientY,
      origX: pos.x,
      origY: pos.y,
      pointerId: e.pointerId,
    };
    setDragging(true);
    setZ(9999);
    onDragStart && onDragStart(id);
    e.stopPropagation();
  };

  const onPointerMove = (e) => {
    if (!dragRef.current.active) return;
    const dx = e.clientX - dragRef.current.startX;
    const dy = e.clientY - dragRef.current.startY;
    if (Math.abs(dx) + Math.abs(dy) > 3) dragRef.current.moved = true;
    setPos(p => ({ ...p, x: dragRef.current.origX + dx, y: dragRef.current.origY + dy }));
  };

  const onPointerUp = (e) => {
    if (!dragRef.current.active) return;
    const wasMove = dragRef.current.moved;
    dragRef.current.active = false;
    setDragging(false);
    setZ(zBase + (wasMove ? 10 : 0));
    if (wasMove) setHasDragged(true); // Remember user manually positioned this sticker
    try { elRef.current.releasePointerCapture(e.pointerId); } catch {}
    onDragEnd && onDragEnd(id);
    if (!wasMove && onClick) {
      onClick(e);
    }
  };

  const peelLift = hovered && !dragging ? 1 : 0;
  const scale = dragging ? 1.08 : (hovered ? 1.05 : 1);
  // Hover wiggle: subtle rotation offset
  const hoverRotOffset = hovered && !dragging ? (Math.sin(Date.now() * 0.01) * 0 + 2) : 0;

  return (
    <div
      ref={elRef}
      className={'sticker ' + className}
      style={{
        position: 'absolute',
        left: pos.x,
        top: pos.y,
        transform: `rotate(${pos.rot + hoverRotOffset}deg) scale(${scale})`,
        zIndex: z,
        cursor: dragging ? 'grabbing' : 'grab',
        transition: dragging ? 'none' : 'transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1)',
        touchAction: 'none',
        opacity: 0,
        animation: `stickerPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) ${entranceDelay}ms forwards`,
        ...style,
      }}
      title={title}
      onPointerDown={onPointerDown}
      onPointerMove={onPointerMove}
      onPointerUp={onPointerUp}
      onPointerCancel={onPointerUp}
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
    >
      <div style={{
        position: 'relative',
        filter: dragging
          ? 'drop-shadow(0 24px 32px rgba(40,30,10,0.35)) drop-shadow(0 8px 12px rgba(40,30,10,0.25))'
          : hovered
            ? 'drop-shadow(0 16px 24px rgba(40,30,10,0.30)) drop-shadow(0 6px 10px rgba(40,30,10,0.22))'
            : 'drop-shadow(0 6px 10px rgba(40,30,10,0.20)) drop-shadow(0 2px 4px rgba(40,30,10,0.16))',
        transition: 'filter 0.28s, transform 0.28s',
        transform: peelLift ? 'translateY(-4px)' : 'none',
      }}>
        {children}
      </div>
      <style>{`
        @keyframes stickerPop {
          0% { opacity: 0; transform: rotate(${pos.rot - 8}deg) scale(0.3); }
          60% { opacity: 1; transform: rotate(${pos.rot + 3}deg) scale(1.08); }
          80% { transform: rotate(${pos.rot - 1}deg) scale(0.97); }
          100% { opacity: 1; transform: rotate(${pos.rot}deg) scale(1); }
        }
      `}</style>
    </div>
  );
}

// Photo sticker — image with thick white die-cut border
function PhotoSticker(props) {
  const { src, w = 140, h = 180, shape = 'rounded', ...rest } = props;
  const radius = shape === 'circle' ? '50%' : shape === 'rounded' ? '14px' : '4px';
  return (
    <Sticker {...rest}>
      <div style={{
        width: w,
        height: h,
        background: '#fff',
        borderRadius: radius,
        padding: 8,
        boxSizing: 'border-box',
      }}>
        <div style={{
          width: '100%',
          height: '100%',
          backgroundImage: `url(${src})`,
          backgroundSize: 'cover',
          backgroundPosition: 'center top',
          borderRadius: shape === 'circle' ? '50%' : '6px',
        }} />
      </div>
    </Sticker>
  );
}

// Image sticker — any image with a white die-cut border

  const { src, size = 86, bg = '#ffffff', pad = 8, radius = 18, ...rest } = props;

        <img src={src} alt="" draggable="false" style={{
          width: '100%', height: '100%', objectFit: 'contain', pointerEvents: 'none',
        }}/>
      </div>
    </Sticker>
  );
}

function CardStack() {
  const [idx, setIdx] = useState(0);
  const [drag, setDrag] = useState({ active: false, dx: 0, dy: 0 });
  const [flyOff, setFlyOff] = useState(null);
  const startRef = useRef(null);

  const cardOrder = [];
  for (let i = 0; i < 3; i++) {
    const c = (idx + i) % CARDS.length;
    cardOrder.push(c);
  }

  const DRAG_THRESHOLD = 60;
  const DRAG_MIN = 4;
  const FLY_MS = 950;

  const onDown = (e) => {
    if (e.button && e.button !== 0) return;
    if (e.target.closest('[data-nodrag]')) return;
    e.currentTarget.setPointerCapture(e.pointerId);
    startRef.current = { x: e.clientX, y: e.clientY, moved: false };
  };

  const onMove = (e) => {
    if (!startRef.current) return;
    const dx = e.clientX - startRef.current.x;
    const dy = e.clientY - startRef.current.y;
    if (!startRef.current.moved && Math.hypot(dx, dy) < DRAG_MIN) return;
    startRef.current.moved = true;
    setDrag({ active: true, dx, dy });
  };

  const onUp = (e) => {
    if (!startRef.current) return;
    const moved = startRef.current.moved;
    const { dx, dy } = drag;
    const dist = Math.hypot(dx, dy);
    startRef.current = null;
    if (moved && dist > DRAG_THRESHOLD) {
      const angle = Math.atan2(dy, dx);
      const fx = Math.cos(angle) * 1000;
      const fy = Math.sin(angle) * 800 - 30;
      setFlyOff({ dx: fx, dy: fy, rot: dx * 0.035 });
      setTimeout(() => {
        setIdx(i => (i + 1) % CARDS.length);
        setFlyOff(null);
        setDrag({ active: false, dx: 0, dy: 0 });
      }, FLY_MS);
    } else {
      setDrag({ active: false, dx: 0, dy: 0 });
    }
  };

  const next = () => {
    setFlyOff({ dx: 900, dy: 40, rot: 8 });
    setTimeout(() => {
      setIdx(i => (i + 1) % CARDS.length);
      setFlyOff(null);
      setDrag({ active: false, dx: 0, dy: 0 });
    }, FLY_MS);
  };

  const prev = () => {
    setFlyOff({ dx: -900, dy: 40, rot: -8 });
    setTimeout(() => {
      setIdx(i => (i - 1 + CARDS.length) % CARDS.length);
      setFlyOff(null);
      setDrag({ active: false, dx: 0, dy: 0 });
    }, FLY_MS);
  };

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'ArrowRight') next();
      if (e.key === 'ArrowLeft') prev();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  return (
    <div style={{
      position: 'absolute',
      left: '50%',
      top: '50%',
      transform: 'translate(-50%, -50%)',
      width: 440,
      height: 320,
      zIndex: 500,
    }}>
      {/* pile of cards behind - more visible layering */}
      {[5,4,3,2,1].map(n => (
        <div key={'shadow'+n} style={{
          position: 'absolute',
          inset: 0,
          background: n <= 2 ? '#232323' : '#1a1a1a',
          borderRadius: 18,
          transform: `translateY(${n*10}px) scale(${1 - n*0.018}) rotate(${n * 0.3}deg)`,
          opacity: n <= 2 ? 0.95 : 0.4 - n*0.06,
          boxShadow: n <= 2 ? '0 4px 12px rgba(0,0,0,0.15)' : 'none',
          zIndex: -n,
        }}/>
      ))}

      {cardOrder.map((cardIdx, stackPos) => {
        const card = CARDS[cardIdx];
        const isTop = stackPos === 0;
        const flying = isTop && flyOff;
        const translate = isTop
          ? (flying ? `translate(calc(-50% + ${flyOff.dx}px), calc(-50% + ${flyOff.dy}px)) rotate(${flyOff.rot}deg)`
                    : `translate(calc(-50% + ${drag.dx}px), calc(-50% + ${drag.dy}px)) rotate(${drag.dx * 0.05}deg)`)
          : `translate(-50%, calc(-50% + ${stackPos*6}px)) scale(${1 - stackPos*0.03})`;

        return (
          <div
            key={cardIdx + '-' + stackPos}
            onPointerDown={isTop ? onDown : undefined}
            onPointerMove={isTop ? onMove : undefined}
            onPointerUp={isTop ? onUp : undefined}
            onPointerCancel={isTop ? onUp : undefined}
            style={{
              position: 'absolute',
              left: '50%',
              top: '50%',
              width: 440,
              minHeight: 300,
              background: '#1a1a1a',
              color: '#f5f2e8',
              borderRadius: 18,
              padding: '28px 30px 26px',
              boxSizing: 'border-box',
              transform: translate,
              transition: flying
                ? 'transform 0.95s cubic-bezier(0.16, 0.84, 0.44, 1)'
                : drag.active && isTop ? 'none' : 'transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)',
              boxShadow: isTop
                ? '0 25px 50px rgba(20,15,5,0.4), 0 12px 24px rgba(20,15,5,0.3), 0 0 0 1px rgba(255,255,255,0.05) inset'
                : '0 10px 20px rgba(20,15,5,0.25)',
              zIndex: 100 - stackPos,
              cursor: isTop ? (drag.active ? 'grabbing' : 'grab') : 'default',
              touchAction: 'none',
              display: 'flex',
              flexDirection: 'column',
              pointerEvents: isTop ? 'auto' : 'none',
            }}
          >
            {/* Top chrome: prev / idx / next */}
            <div style={{
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
              gap: 14,
              marginBottom: 16,
              fontFamily: "'Geist Mono', monospace",
              fontSize: 12,
              color: 'rgba(245,242,232,0.5)',
              whiteSpace: 'nowrap',
            }}>
              <button
                data-nodrag
                onPointerDown={(e)=>e.stopPropagation()}
                onClick={(e)=>{e.stopPropagation(); prev();}}
                style={chevBtn}
                aria-label="previous card">‹</button>
              <span style={{whiteSpace:'nowrap', minWidth: 56, textAlign:'center', display:'inline-block'}}>{String(cardIdx + 1).padStart(2,'0')}&nbsp;/&nbsp;{String(CARDS.length).padStart(2,'0')}</span>
              <button
                data-nodrag
                onPointerDown={(e)=>e.stopPropagation()}
                onClick={(e)=>{e.stopPropagation(); next();}}
                style={chevBtn}
                aria-label="next card">›</button>
            </div>

            <CardBody card={card} />
          </div>
        );
      })}
    </div>
  );
}

let audioCtx = null;
function playSongSnippet() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const ctx = audioCtx;
  if (ctx.state === 'suspended') ctx.resume();
  const now = ctx.currentTime;
  const chords = [
    [349.23, 440.00, 523.25, 659.25],
    [329.63, 392.00, 493.88, 587.33],
    [293.66, 349.23, 440.00, 523.25],
    [261.63, 329.63, 392.00, 493.88],
  ];
  chords.forEach((notes, i) => {
    const start = now + i * 0.9;
    notes.forEach(freq => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, start);
      gain.gain.linearRampToValueAtTime(0.09, start + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, start + 0.85);
      osc.connect(gain).connect(ctx.destination);
      osc.start(start);
      osc.stop(start + 0.9);
    });
  });
}

function EqBars({ playing }) {

        @keyframes eq3 { 0% { height: 18px } 100% { height: 26px } }

      `}</style>

  );
}

    const onR = () => setDims({ w: window.innerWidth, h: window.innerHeight });
    window.addEventListener('resize', onR);
    return () => window.removeEventListener('resize', onR);
  }, []);

  // Center-based orbital positioning - stickers cluster around the card
  const cx = dims.w / 2;
  const cy = dims.h / 2;
  const cardW = 440, cardH = 320;

  // Place sticker at angle (degrees) and distance from center
  // Distance is from the edge of the card, not absolute from center
  function placeOrbital(angleDeg, distance, w, h, rot) {
    const angle = (angleDeg * Math.PI) / 180;
    // Elliptical base distance accounts for card dimensions
    const baseX = cardW / 2 + 40; // card half-width + padding
    const baseY = cardH / 2 + 40; // card half-height + padding

    // Calculate position on ellipse + additional distance
    const radiusX = baseX + distance;
    const radiusY = baseY + distance * 0.7; // Slightly compressed vertically

    const x = cx + Math.cos(angle) * radiusX - w / 2;
    const y = cy + Math.sin(angle) * radiusY - h / 2;

    return { x, y, w, h, rot };
  }

  function overlaps(a, b, pad = 6) {
    return a.x + a.w + pad > b.x && a.x < b.x + b.w + pad
        && a.y + a.h + pad > b.y && a.y < b.y + b.h + pad;
  }

  function resolveOverlaps(list) {
    for (let i = 0; i < list.length; i++) {
      for (let j = 0; j < i; j++) {
        let tries = 0;
        while (overlaps(list[i], list[j]) && tries < 30) {
          const ax = list[i].x + list[i].w/2;
          const ay = list[i].y + list[i].h/2;
          const bx = list[j].x + list[j].w/2;
          const by = list[j].y + list[j].h/2;
          // Push away from center AND from other sticker
          const dx = ax - bx || 0.5;
          const dy = ay - by || 0.5;
          const len = Math.hypot(dx, dy) || 1;
          list[i].x += (dx/len) * 10;
          list[i].y += (dy/len) * 10;
          tries++;
        }
      }
    }
    return list;

          always up for coffee if you're in town.
        </div>
      </Modal>

      <Modal open={modal==='travel'} onClose={()=>setModal(null)} title="places I've been" color="#1a1a1a">
        <div style={{ fontSize: 12, color: 'rgba(245,242,232,0.6)', marginBottom: 12 }}>a non-exhaustive list, in no order:</div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap: '6px 18px', fontSize: 13, color:'#f5f2e8' }}>
          {['hyderabad','washington dc','new york','lisbon','tokyo','berlin','bali','reykjavík','mexico city','san francisco','istanbul','kerala'].map(p=>(
            <div key={p} style={{ display:'flex', alignItems:'center', gap: 8 }}>
              <span style={{ color:'#e85d3a' }}>✦</span>{p}
            </div>
          ))}
        </div>
        <div style={{ fontSize: 11, color: 'rgba(245,242,232,0.5)', marginTop: 14, fontStyle:'italic' }}>next up: buenos aires, hopefully.</div>
      </Modal>

      <Modal open={modal==='beach'} onClose={()=>setModal(null)} title="beach brain" color="#2d6cdf">
        <div style={{ fontSize: 13.5, lineHeight: 1.6, color:'#faf7ef' }}>
          my best product ideas happen when I'm 10 feet from the water and nowhere near a laptop. kerala backwaters &gt; boardrooms.
        </div>
      </Modal>

      <Modal open={modal==='pickleball'} onClose={()=>setModal(null)} title="pickleball szn" color="#3a7d44">
        <div style={{ fontSize: 13.5, lineHeight: 1.6, color:'#faf7ef' }}>
          currently 3.2 DUPR. working my way up. if you play in DC, hit me up — I need doubles partners who don't mind losing a few.
        </div>
      </Modal>

      <Modal open={modal==='camera'} onClose={()=>setModal(null)} title="photo walks" color="#1a1a1a">
        <div style={{ fontSize: 13.5, lineHeight: 1.6, color:'#f5f2e8' }}>
          mostly street + architecture on a fuji x100v. not for the 'gram — just for me. there's something about noticing that makes me a better PM too.
        </div>
      </Modal>

      <Modal open={modal==='coffee'} onClose={()=>setModal(null)} title="coffee order" color="#6b3a1f">
        <div style={{ fontSize: 13.5, lineHeight: 1.6, color:'#faf7ef' }}>
          cortado, no sugar. if it's after 3pm, a matcha. if we're meeting for coffee, I probably want to talk about what you're building.
        </div>
      </Modal>

      <Modal open={modal==='gym'} onClose={()=>setModal(null)} title="lifting" color="#2d6cdf">
        <div style={{ fontSize: 13.5, lineHeight: 1.6, color:'#faf7ef' }}>
          5x/week, push-pull-legs. shipping products is mostly sitting down — the gym is where I pay the tax. current bench PR: a polite number I'm working on.
        </div>
      </Modal>

      <Modal open={modal==='portrait'} onClose={()=>setModal(null)} title="hi, that's me" color="#1a1a1a">
        <div style={{ fontSize: 13.5, lineHeight: 1.6, color:'#f5f2e8' }}>
          taken under the cherry blossoms last spring. the stripes were a mistake, the blossoms were not.
        </div>
      </Modal>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
