// ============================================================================
// Sticker system: draggable, peel-on-hover, click handlers
// ============================================================================

const { useState, useEffect, useRef, useCallback } = React;

// Tap sound using Web Audio API
let tapAudioCtx = null;
function playTapSound() {
  if (!tapAudioCtx) tapAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const ctx = tapAudioCtx;
  if (ctx.state === 'suspended') ctx.resume();

  const now = ctx.currentTime;

  // Create a short click sound using noise burst
  const bufferSize = ctx.sampleRate * 0.015; // 15ms
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);

  for (let i = 0; i < bufferSize; i++) {
    // Sharp attack, quick decay
    const envelope = Math.exp(-i / (bufferSize * 0.15));
    data[i] = (Math.random() * 2 - 1) * envelope;
  }

  const noise = ctx.createBufferSource();
  noise.buffer = buffer;

  // Bandpass filter to shape the click
  const filter = ctx.createBiquadFilter();
  filter.type = 'bandpass';
  filter.frequency.value = 2500;
  filter.Q.value = 1.2;

  const gain = ctx.createGain();
  gain.gain.value = 0.4;

  noise.connect(filter).connect(gain).connect(ctx.destination);
  noise.start(now);
}

// Base Sticker component — handles drag, peel, rotation, shadow, entrance animation
function Sticker({
  id,
  initial,
  zBase = 1,
  children,
  onClick,
  onDragStart,
  onDragEnd,
  title,
  peelColor = '#ffffff',
  className = '',
  style = {},
  entranceDelay = 0,
}) {
  const [pos, setPos] = useState({ x: initial.x, y: initial.y, rot: initial.rot || 0 });
  const [dragging, setDragging] = useState(false);
  const [hovered, setHovered] = useState(false);
  const [z, setZ] = useState(zBase);
  const [hasDragged, setHasDragged] = useState(false);
  const [hasEntered, setHasEntered] = useState(false);
  const dragRef = useRef({ active: false, moved: false, startX: 0, startY: 0, origX: 0, origY: 0, pointerId: null });
  const elRef = useRef(null);

  // Entrance animation trigger
  useEffect(() => {
    const timer = setTimeout(() => setHasEntered(true), entranceDelay);
    return () => clearTimeout(timer);
  }, [entranceDelay]);

  // Update position when initial changes (window resize) - but only if user hasn't dragged
  useEffect(() => {
    if (!hasDragged) {
      setPos({ x: initial.x, y: initial.y, rot: initial.rot || 0 });
    }
  }, [initial.x, initial.y, initial.rot, hasDragged]);

  const onPointerDown = (e) => {
    if (e.button && e.button !== 0) return;
    playTapSound(); // Play tap sound on touch
    elRef.current.setPointerCapture(e.pointerId);
    dragRef.current = {
      active: true,
      moved: false,
      startX: e.clientX,
      startY: e.clientY,
      origX: pos.x,
      origY: pos.y,
      pointerId: e.pointerId,
    };
    setDragging(true);
    setZ(9999);
    onDragStart && onDragStart(id);
    e.stopPropagation();
  };

  const onPointerMove = (e) => {
    if (!dragRef.current.active) return;
    const dx = e.clientX - dragRef.current.startX;
    const dy = e.clientY - dragRef.current.startY;
    if (Math.abs(dx) + Math.abs(dy) > 3) dragRef.current.moved = true;
    setPos(p => ({ ...p, x: dragRef.current.origX + dx, y: dragRef.current.origY + dy }));
  };

  const onPointerUp = (e) => {
    if (!dragRef.current.active) return;
    const wasMove = dragRef.current.moved;
    dragRef.current.active = false;
    setDragging(false);
    setZ(zBase + (wasMove ? 10 : 0));
    if (wasMove) setHasDragged(true); // Remember user manually positioned this sticker
    try { elRef.current.releasePointerCapture(e.pointerId); } catch {}
    onDragEnd && onDragEnd(id);
    if (!wasMove && onClick) {
      onClick(e);
    }
  };

  const peelLift = hovered && !dragging ? 1 : 0;
  const scale = dragging ? 1.08 : (hovered ? 1.05 : 1);
  // Hover wiggle: subtle rotation offset
  const hoverRotOffset = hovered && !dragging ? (Math.sin(Date.now() * 0.01) * 0 + 2) : 0;

  return (
    <div
      ref={elRef}
      className={'sticker ' + className}
      style={{
        position: 'absolute',
        left: pos.x,
        top: pos.y,
        transform: `rotate(${pos.rot + hoverRotOffset}deg) scale(${scale})`,
        zIndex: z,
        cursor: dragging ? 'grabbing' : 'grab',
        transition: dragging ? 'none' : 'transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1)',
        touchAction: 'none',
        opacity: 0,
        animation: `stickerPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) ${entranceDelay}ms forwards`,
        ...style,
      }}
      title={title}
      onPointerDown={onPointerDown}
      onPointerMove={onPointerMove}
      onPointerUp={onPointerUp}
      onPointerCancel={onPointerUp}
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
    >
      <div style={{
        position: 'relative',
        filter: dragging
          ? 'drop-shadow(0 24px 32px rgba(40,30,10,0.35)) drop-shadow(0 8px 12px rgba(40,30,10,0.25))'
          : hovered
            ? 'drop-shadow(0 16px 24px rgba(40,30,10,0.30)) drop-shadow(0 6px 10px rgba(40,30,10,0.22))'
            : 'drop-shadow(0 6px 10px rgba(40,30,10,0.20)) drop-shadow(0 2px 4px rgba(40,30,10,0.16))',
        transition: 'filter 0.28s, transform 0.28s',
        transform: peelLift ? 'translateY(-4px)' : 'none',
      }}>
        {children}
      </div>
      <style>{`
        @keyframes stickerPop {
          0% { opacity: 0; transform: rotate(${pos.rot - 8}deg) scale(0.3); }
          60% { opacity: 1; transform: rotate(${pos.rot + 3}deg) scale(1.08); }
          80% { transform: rotate(${pos.rot - 1}deg) scale(0.97); }
          100% { opacity: 1; transform: rotate(${pos.rot}deg) scale(1); }
        }
      `}</style>
    </div>
  );
}

// Photo sticker — image with optional white die-cut border
function PhotoSticker(props) {
  const { src, w = 140, h = 180, shape = 'rounded', noBorder = false, ...rest } = props;
  const radius = shape === 'circle' ? '50%' : shape === 'rounded' ? '14px' : '4px';

  // Clean sticker mode - no border, just the image with a subtle shadow
  if (noBorder) {
    return (
      <Sticker {...rest}>
        <img
          src={src}
          alt=""
          draggable="false"
          style={{
            width: w,
            height: h,
            objectFit: 'contain',
            filter: 'drop-shadow(0 4px 12px rgba(0,0,0,0.25))',
            pointerEvents: 'none',
          }}
        />
      </Sticker>
    );
  }

  return (
    <Sticker {...rest}>
      <div style={{
        width: w,
        height: h,
        background: '#fff',
        borderRadius: radius,
        padding: 8,
        boxSizing: 'border-box',
      }}>
        <div style={{
          width: '100%',
          height: '100%',
          backgroundImage: `url(${src})`,
          backgroundSize: 'cover',
          backgroundPosition: 'center top',
          borderRadius: shape === 'circle' ? '50%' : '6px',
        }} />
      </div>
    </Sticker>
  );
}

// AirPods sticker with opening animation
function AirPodsSticker({ onPlay, ...props }) {
  const [isOpen, setIsOpen] = useState(false);
  const [isAnimating, setIsAnimating] = useState(false);

  const handleClick = () => {
    if (isAnimating) return;
    setIsAnimating(true);
    setIsOpen(true);

    // Play the opening sound effect
    if (tapAudioCtx) {
      const ctx = tapAudioCtx;
      if (ctx.state === 'suspended') ctx.resume();
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.2);
    }

    setTimeout(() => {
      onPlay && onPlay();
      setTimeout(() => {
        setIsOpen(false);
        setIsAnimating(false);
      }, 800);
    }, 400);
  };

  return (
    <Sticker {...props} onClick={handleClick}>
      <div style={{
        width: 90,
        height: 100,
        background: '#fff',
        borderRadius: 14,
        padding: 6,
        boxSizing: 'border-box',
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'center',
        position: 'relative',
        overflow: 'visible',
      }}>
        <img
          src="assets/icons/earphone.png"
          alt="AirPods"
          draggable="false"
          style={{
            width: '100%',
            height: '100%',
            objectFit: 'contain',
            pointerEvents: 'none',
            transform: isOpen ? 'scale(1.1)' : 'scale(1)',
            transition: 'transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1)',
          }}
        />
        {/* Music notes animation when open */}
        {isOpen && (
          <>
            {[0, 1, 2].map(i => (
              <div key={i} style={{
                position: 'absolute',
                top: -10 - i * 8,
                left: 20 + i * 20,
                fontSize: 16,
                animation: `musicNote 0.8s ease-out ${i * 0.15}s forwards`,
                opacity: 0,
              }}>♪</div>
            ))}
          </>
        )}
        <style>{`
          @keyframes musicNote {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translateY(-30px) rotate(20deg); opacity: 0; }
          }
        `}</style>
      </div>
    </Sticker>
  );
}

function CoffeeMachineSticker({ onBrew, ...props }) {
  const [brewing, setBrewing] = useState(false);

  const handleClick = () => {
    if (brewing) return;
    setBrewing(true);
    // Play a subtle brewing sound effect
    if (tapAudioCtx) {
      const ctx = tapAudioCtx;
      if (ctx.state === 'suspended') ctx.resume();
      // Create a low rumble + hiss sound
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(80, now);
      osc.frequency.exponentialRampToValueAtTime(40, now + 1.5);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 1.8);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 2);
    }
    setTimeout(() => {
      setBrewing(false);
      onBrew && onBrew();
    }, 2200);
  };

  return (
    <Sticker {...props} onClick={handleClick}>
      <div style={{ position: 'relative', width: 100, height: 130 }}>
        {/* Steam particles - only visible when brewing */}
        <div style={{
          position: 'absolute',
          top: -20,
          left: '50%',
          transform: 'translateX(-50%)',
          width: 60,
          height: 40,
          pointerEvents: 'none',
          opacity: brewing ? 1 : 0,
          transition: 'opacity 0.3s',
        }}>
          {[0,1,2,3,4].map(i => (
            <div key={i} style={{
              position: 'absolute',
              left: 10 + i * 10,
              bottom: 0,
              width: 6,
              height: 6,
              borderRadius: '50%',
              background: 'rgba(255,255,255,0.7)',
              animation: brewing ? `steam ${0.8 + i * 0.15}s ease-out infinite` : 'none',
              animationDelay: `${i * 0.12}s`,
            }} />
          ))}
        </div>

        {/* Coffee machine body */}
        <div style={{
          width: 100,
          height: 110,
          background: '#fff',
          borderRadius: 14,
          padding: 6,
          boxSizing: 'border-box',
          animation: brewing ? 'machineShake 0.1s infinite' : 'none',
        }}>
          <img
            src="assets/icons/coffee-machine.png"
            alt="Coffee Machine"
            draggable="false"
            style={{
              width: '100%',
              height: '100%',
              objectFit: 'contain',
              pointerEvents: 'none',
            }}
          />

          {/* Coffee drip animation overlay */}
          {brewing && (
            <div style={{
              position: 'absolute',
              bottom: 28,
              left: '50%',
              transform: 'translateX(-50%)',
              width: 4,
              height: 0,
              background: 'linear-gradient(to bottom, #8B4513, #5D3A1A)',
              borderRadius: 2,
              animation: 'coffeeDrip 0.6s ease-in-out infinite',
            }} />
          )}
        </div>

        {/* BREW ME label */}
        <div style={{
          position: 'absolute',
          bottom: 0,
          left: '50%',
          transform: 'translateX(-50%)',
          background: brewing ? '#8B4513' : '#6b3a1f',
          color: '#faf7ef',
          fontFamily: "'Geist Mono', monospace",
          fontSize: 9,
          fontWeight: 700,
          padding: '4px 10px',
          borderRadius: 6,
          letterSpacing: '0.08em',
          whiteSpace: 'nowrap',
          border: '2px solid #fff',
          transition: 'background 0.3s, transform 0.3s',
          animation: brewing ? 'none' : 'brewPulse 2s ease-in-out infinite',
        }}>
          {brewing ? '☕ BREWING...' : '☕ BREW ME'}
        </div>

        <style>{`
          @keyframes steam {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            50% { transform: translateY(-15px) scale(1.3); opacity: 0.5; }
            100% { transform: translateY(-30px) scale(0.6); opacity: 0; }
          }
          @keyframes machineShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-1px) rotate(-0.5deg); }
            75% { transform: translateX(1px) rotate(0.5deg); }
          }
          @keyframes coffeeDrip {
            0% { height: 0; opacity: 0; }
            20% { height: 12px; opacity: 1; }
            80% { height: 12px; opacity: 1; }
            100% { height: 0; opacity: 0; transform: translateX(-50%) translateY(15px); }
          }
          @keyframes brewPulse {
            0%, 100% { transform: translateX(-50%) scale(1); }
            50% { transform: translateX(-50%) scale(1.05); }

      </div>

}

  const startRef = useRef(null);

  // Responsive sizing
  const [dims, setDims] = useState({ w: window.innerWidth, h: window.innerHeight });
  useEffect(() => {
    const onR = () => setDims({ w: window.innerWidth, h: window.innerHeight });
    window.addEventListener('resize', onR);
    return () => window.removeEventListener('resize', onR);
  }, []);

  const isMobile = dims.w <= 768;
  const cardW = isMobile ? Math.min(dims.w - 32, 400) : 440;
  const cardH = isMobile ? 'auto' : 320;
  const cardMinH = isMobile ? 280 : 300;
  const cardPadding = isMobile ? '24px 20px 22px' : '28px 30px 26px';

  const cardOrder = [];
  for (let i = 0; i < 3; i++) {
    const c = (idx + i) % CARDS.length;
    cardOrder.push(c);
  }

  const DRAG_THRESHOLD = 60;
  const DRAG_MIN = 4;
  const SHUFFLE_MS = 450;

  const onDown = (e) => {
    if (e.button && e.button !== 0) return;
    if (e.target.closest('[data-nodrag]')) return;
    if (shuffling) return;
    e.currentTarget.setPointerCapture(e.pointerId);
    startRef.current = { x: e.clientX, y: e.clientY, moved: false };
  };

  const onMove = (e) => {
    if (!startRef.current || shuffling) return;
    const dx = e.clientX - startRef.current.x;
    const dy = e.clientY - startRef.current.y;
    if (!startRef.current.moved && Math.hypot(dx, dy) < DRAG_MIN) return;
    startRef.current.moved = true;
    setDrag({ active: true, dx, dy });
  };

  const onUp = (e) => {
    if (!startRef.current || shuffling) return;
    const moved = startRef.current.moved;
    const { dx } = drag;
    const dist = Math.abs(dx);
    startRef.current = null;
    if (moved && dist > DRAG_THRESHOLD) {
      // Determine direction based on drag
      if (dx > 0) {
        prev();
      } else {
        next();
      }
    } else {
      setDrag({ active: false, dx: 0, dy: 0 });
    }
  };

  // Shuffle sound effect - soft card flick
  const playShuffleSound = () => {
    if (!tapAudioCtx) tapAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = tapAudioCtx;
    if (ctx.state === 'suspended') ctx.resume();

    const now = ctx.currentTime;

    // Light paper flick - quick and subtle
    const flickSize = ctx.sampleRate * 0.06;
    const flickBuffer = ctx.createBuffer(1, flickSize, ctx.sampleRate);
    const flickData = flickBuffer.getChannelData(0);

    for (let i = 0; i < flickSize; i++) {
      const t = i / flickSize;
      // Quick attack, smooth decay
      const envelope = Math.exp(-t * 8) * (1 - Math.exp(-t * 80));
      flickData[i] = (Math.random() * 2 - 1) * envelope;
    }

    const flick = ctx.createBufferSource();
    flick.buffer = flickBuffer;

    // Bandpass for paper-like quality
    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.frequency.value = 2500;
    filter.Q.value = 0.8;

    const gain = ctx.createGain();
    gain.gain.value = 0.3;

    flick.connect(filter).connect(gain).connect(ctx.destination);
    flick.start(now);
  };

  const next = () => {
    if (shuffling) return;
    playShuffleSound();
    setShuffling('next');
    setDrag({ active: false, dx: 0, dy: 0 });
    setTimeout(() => {
      setIdx(i => (i + 1) % CARDS.length);
      setShuffling(null);
    }, SHUFFLE_MS);
  };

  const prev = () => {
    if (shuffling) return;
    playShuffleSound();
    // For prev: change index first, then animate new card coming from back
    setIdx(i => (i - 1 + CARDS.length) % CARDS.length);
    setShuffling('prev');
    setDrag({ active: false, dx: 0, dy: 0 });
    setTimeout(() => {
      setShuffling(null);
    }, SHUFFLE_MS);
  };

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'ArrowRight') next();
      if (e.key === 'ArrowLeft') prev();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [shuffling]);

  const stackOffset = isMobile ? 6 : 10;

  return (
    <div style={{
      position: isMobile ? 'relative' : 'absolute',
      left: isMobile ? 'auto' : '50%',
      top: isMobile ? 'auto' : '50%',
      transform: isMobile ? 'none' : 'translate(-50%, -50%)',
      width: cardW,
      height: isMobile ? 'auto' : 320,
      minHeight: cardMinH,
      zIndex: 500,
      margin: isMobile ? '80px auto 0' : 0,
    }}>
      {/* Card shuffle animation */}
      <style>{`
        @keyframes cardFromBack {
          0% {
            transform: translate(-50%, calc(-50% + ${5 * stackOffset}px)) scale(0.88) rotate(-4deg);
            opacity: 0.5;
          }
          100% {
            transform: translate(-50%, -50%) scale(1) rotate(0deg);
            opacity: 1;
          }
        }
      `}</style>

      {/* pile of cards behind - more visible layering */}
      {[5,4,3,2,1].map(n => (
        <div key={'shadow'+n} style={{
          position: 'absolute',
          inset: 0,
          background: n <= 2 ? '#232323' : '#1a1a1a',
          borderRadius: isMobile ? 14 : 18,
          transform: `translateY(${n*(isMobile ? 6 : 10)}px) scale(${1 - n*0.018}) rotate(${n * 0.3}deg)`,
          opacity: n <= 2 ? 0.95 : 0.4 - n*0.06,
          boxShadow: n <= 2 ? '0 4px 12px rgba(0,0,0,0.15)' : 'none',
          zIndex: -n,
        }}/>
      ))}

      {cardOrder.map((cardIdx, stackPos) => {
        const card = CARDS[cardIdx];
        const isTop = stackPos === 0;
        const isSecond = stackPos === 1;

        // Stack shuffle animation logic
        let transform, opacity, zIndex;

        if (shuffling === 'next' && isTop) {
          // NEXT: Top card moves to the back of the stack
          transform = `translate(-50%, calc(-50% + ${5 * stackOffset}px)) scale(0.88) rotate(4deg)`;
          opacity = 0.4;
          zIndex = 90;
        } else if (shuffling === 'next' && !isTop) {
          // NEXT: Other cards move up one position
          const newStackPos = Math.max(0, stackPos - 1);
          transform = `translate(-50%, calc(-50% + ${newStackPos * stackOffset}px)) scale(${1 - newStackPos * 0.03})`;
          opacity = newStackPos === 0 ? 1 : 0.95;
          zIndex = 100 - newStackPos;
        } else if (shuffling === 'prev' && isTop) {
          // PREV: New top card comes FROM the back to front
          // We use CSS animation to make it appear from the back
          transform = `translate(-50%, -50%) scale(1) rotate(-2deg)`;
          opacity = 1;
          zIndex = 100;
        } else if (shuffling === 'prev' && !isTop) {
          // PREV: Other cards move down one position
          const newStackPos = stackPos + 1;
          transform = `translate(-50%, calc(-50% + ${newStackPos * stackOffset}px)) scale(${1 - newStackPos * 0.03})`;
          opacity = 0.7;
          zIndex = 100 - newStackPos;
        } else if (isTop && drag.active) {
          // Dragging the top card
          transform = `translate(calc(-50% + ${drag.dx}px), calc(-50% + ${drag.dy}px)) rotate(${drag.dx * 0.04}deg)`;
          opacity = 1;
          zIndex = 100;
        } else {
          // Default stack position
          transform = `translate(-50%, calc(-50% + ${stackPos * stackOffset}px)) scale(${1 - stackPos * 0.03})`;
          opacity = isTop ? 1 : (isSecond ? 0.95 : 0.6);
          zIndex = 100 - stackPos;
        }

        return (
          <div
            key={cardIdx + '-' + stackPos}
            onPointerDown={isTop ? onDown : undefined}
            onPointerMove={isTop ? onMove : undefined}
            onPointerUp={isTop ? onUp : undefined}
            onPointerCancel={isTop ? onUp : undefined}
            style={{
              position: 'absolute',
              left: '50%',
              top: '50%',
              width: cardW,
              minHeight: cardMinH,
              background: '#1a1a1a',
              color: '#f5f2e8',
              borderRadius: isMobile ? 14 : 18,
              padding: cardPadding,
              boxSizing: 'border-box',
              transform,
              opacity,
              transition: (shuffling === 'prev' && isTop)
                ? 'none'
                : shuffling
                  ? 'transform 0.45s cubic-bezier(0.34, 1.3, 0.64, 1), opacity 0.45s ease'
                  : drag.active && isTop ? 'none' : 'transform 0.5s cubic-bezier(0.34, 1.3, 0.64, 1), opacity 0.3s ease',
              animation: (shuffling === 'prev' && isTop)
                ? 'cardFromBack 0.45s cubic-bezier(0.34, 1.3, 0.64, 1) forwards'
                : 'none',
              boxShadow: isTop && !shuffling
                ? '0 25px 50px rgba(20,15,5,0.4), 0 12px 24px rgba(20,15,5,0.3), 0 0 0 1px rgba(255,255,255,0.05) inset'
                : '0 10px 20px rgba(20,15,5,0.25)',
              zIndex,
              cursor: isTop && !shuffling ? (drag.active ? 'grabbing' : 'grab') : 'default',
              touchAction: 'none',
              display: 'flex',
              flexDirection: 'column',
              pointerEvents: isTop && !shuffling ? 'auto' : 'none',
            }}
          >
            {/* Top chrome: prev / idx / next */}
            <div style={{
              display: 'flex',
              alignItems: 'center',
              justifyContent: 'center',
              gap: isMobile ? 10 : 14,
              marginBottom: isMobile ? 12 : 16,
              fontFamily: "'Geist Mono', monospace",
              fontSize: isMobile ? 11 : 12,
              color: 'rgba(245,242,232,0.5)',
              whiteSpace: 'nowrap',
            }}>
              <button
                data-nodrag
                onPointerDown={(e)=>e.stopPropagation()}
                onClick={(e)=>{e.stopPropagation(); prev();}}
                style={getChevBtnStyle(isMobile)}
                aria-label="previous card">‹</button>
              <span style={{whiteSpace:'nowrap', minWidth: 56, textAlign:'center', display:'inline-block'}}>{String(cardIdx + 1).padStart(2,'0')}&nbsp;/&nbsp;{String(CARDS.length).padStart(2,'0')}</span>
              <button
                data-nodrag
                onPointerDown={(e)=>e.stopPropagation()}
                onClick={(e)=>{e.stopPropagation(); next();}}
                style={getChevBtnStyle(isMobile)}
                aria-label="next card">›</button>
            </div>

            <CardBody card={card} isMobile={isMobile} />
          </div>
        );
      })}
    </div>
  );
}

        @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

      `}</style>
    </div>
  );
}

  const [stoicQuote, setStoicQuote] = useState(null);

  const [dims, setDims] = useState({ w: window.innerWidth, h: window.innerHeight });
  useEffect(() => {
    const onR = () => setDims({ w: window.innerWidth, h: window.innerHeight });
    window.addEventListener('resize', onR);
    return () => window.removeEventListener('resize', onR);
  }, []);

  // Responsive breakpoints
  const isMobile = dims.w <= 768;
  const isSmallMobile = dims.w <= 380;

  // Center-based orbital positioning - stickers cluster around the card
  const cx = dims.w / 2;
  const cy = dims.h / 2;
  const cardW = 440, cardH = 320;

  // Place sticker at angle (degrees) and distance from center
  // Distance is from the edge of the card, not absolute from center
  function placeOrbital(angleDeg, distance, w, h, rot) {
    const angle = (angleDeg * Math.PI) / 180;
    // Elliptical base distance accounts for card dimensions
    const baseX = cardW / 2 + 40; // card half-width + padding
    const baseY = cardH / 2 + 40; // card half-height + padding

    // Calculate position on ellipse + additional distance
    const radiusX = baseX + distance;
    const radiusY = baseY + distance * 0.7; // Slightly compressed vertically

    const x = cx + Math.cos(angle) * radiusX - w / 2;
    const y = cy + Math.sin(angle) * radiusY - h / 2;

    return { x, y, w, h, rot };
  }

  function overlaps(a, b, pad = 6) {
    return a.x + a.w + pad > b.x && a.x < b.x + b.w + pad
        && a.y + a.h + pad > b.y && a.y < b.y + b.h + pad;
  }

  function resolveOverlaps(list) {
    for (let i = 0; i < list.length; i++) {
      for (let j = 0; j < i; j++) {
        let tries = 0;
        while (overlaps(list[i], list[j]) && tries < 30) {
          const ax = list[i].x + list[i].w/2;
          const ay = list[i].y + list[i].h/2;
          const bx = list[j].x + list[j].w/2;
          const by = list[j].y + list[j].h/2;
          // Push away from center AND from other sticker
          const dx = ax - bx || 0.5;
          const dy = ay - by || 0.5;
          const len = Math.hypot(dx, dy) || 1;
          list[i].x += (dx/len) * 10;
          list[i].y += (dy/len) * 10;
          tries++;
        }
      }
    }
    return list;
  }

  // Layout key to force re-mount when viewport changes significantly

    // Right side
